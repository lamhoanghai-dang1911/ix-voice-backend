server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: ix-voice-backend
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true} # Java 21 Virtual Threads enabled
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method

# Application Specific Configurations
app:
  name: "INTEGRIX IX.VOICE"
  version: "0.1.0"
  storage:
    dir: ${STORAGE_LOCAL_DIR:./data/storage}
    fixtures-dir: ${FIXTURES_DIR:./contracts/fixtures}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:5000}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
